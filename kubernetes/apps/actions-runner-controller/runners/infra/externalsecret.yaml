---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# GitHub App credentials the controller uses to mint runner registration
# tokens. The App must be installed on githubConfigUrl's repo with
# Administration read & write. Unpinned, so a rotation is just a new GSM
# version.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infra-runner-github-creds
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    template:
      data:
        github_app_id: "{{ .github_app_id }}"
        github_app_installation_id: "{{ .github_app_installation_id }}"
        github_app_private_key: "{{ .github_app_private_key }}"
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-actions-runner-system-github-app
