---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.26.1-standalone-strict/priorityclass-scheduling-v1.json
# CI runner requests are only a floor: on 2026-11-16 freckle-actions used 10.5 CPU
# on average against 3 requested, peaking at 36.6 (C-1558). Below the default (0),
# so platform pods that need the room preempt runners, and kubelet evicts them
# ahead of default-priority pods under node pressure; a lost job is just re-run.
# preemptionPolicy Never: a pending runner waits for room rather than evicting
# anything else.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-runner-low
value: -100
preemptionPolicy: Never
globalDefault: false
description: Self-hosted CI runner pods; yield to every other workload under pressure.
