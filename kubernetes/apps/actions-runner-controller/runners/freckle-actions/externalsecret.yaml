---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# Org runner registration requires an App installed on frecklelabs with
# organization_self_hosted_runners: write. Keep rotation in GSM.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: freckle-actions-runner-github-creds
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    template:
      data:
        github_app_id: "{{ .github_app_id }}"
        github_app_installation_id: "{{ .github_app_installation_id }}"
        github_app_private_key: "{{ .github_app_private_key }}"
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-freckle-actions-runner-github-app
