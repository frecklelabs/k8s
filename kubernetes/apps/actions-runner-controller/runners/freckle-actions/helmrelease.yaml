---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gha-runner-scale-set
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.15.1
  url: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: freckle-actions-runner
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    githubConfigUrl: https://github.com/frecklelabs
    githubConfigSecret: freckle-actions-runner-github-creds
    minRunners: 0
    maxRunners: 10
    runnerScaleSetName: ${CLUSTER_NAME}-freckle-actions
    # Docker services and builds share a job-local daemon and emptyDir work volume.
    containerMode:
      type: dind
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      spec:
        automountServiceAccountToken: false
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.2
            command: ["/home/runner/run.sh"]
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
  postRenderers:
    - kustomize:
        images:
          - name: docker
            newName: mirror.gcr.io/library/docker
        # The chart generates dind without resource overrides; fail if its layout changes.
        patches:
          - target:
              group: actions.github.com
              version: v1alpha1
              kind: AutoscalingRunnerSet
            patch: |-
              - op: test
                path: /spec/template/spec/initContainers/1/name
                value: dind
              - op: add
                path: /spec/template/spec/initContainers/1/resources
                value:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                  limits:
                    memory: 4Gi
