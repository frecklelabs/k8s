---
# yaml-language-server: $schema=https://www.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
configMapGenerator:
  - name: freckle-actions-buildkit
    files:
      - buildkitd.toml
# HelmRelease references are not rewritten by Kustomize's built-in name rules.
generatorOptions:
  disableNameSuffixHash: true
