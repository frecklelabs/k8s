---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/cilium.io/ciliumnetworkpolicy_v2.json
# Jobs need public registries and GitHub, but must not reach site infrastructure.
# The cluster-wide DNS policy permits name resolution.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: freckle-actions-egress
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - world
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: freckle-actions
    # World egress excludes cluster identities, including the build registry.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: zot
            app.kubernetes.io/name: zot
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dev-platform
            app.kubernetes.io/instance: package-proxy
            app.kubernetes.io/name: proxy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egressDeny:
    - toCIDRSet:
        - cidr: 10.0.0.0/8
        - cidr: 172.16.0.0/12
        - cidr: 192.168.0.0/16
        - cidr: 100.64.0.0/10
