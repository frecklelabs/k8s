---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hookshot
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  interval: 1h
  values:
    defaultPodOptions:
      annotations:
        # Reload the verified GSM credentials even though their rendered bytes match.
        kubectl.kubernetes.io/restartedAt: "2026-11-04T08:49:00Z"
    controllers:
      hookshot:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/matrix-org/matrix-hookshot
              tag: 7.6.2@sha256:808f75ffb2782a7b8ecb993ea1aaaf2b355c3ea7797b1f6a73f4a917d8de98e9
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
            # probes:
            #   liveness:
            #     enabled: true
            #     custom: true
            #     spec:
            #       httpGet:
            #         path: /metrics
            #         port: 9001
            #       initialDelaySeconds: 10
            #       periodSeconds: 30
            #       timeoutSeconds: 5
            #       failureThreshold: 3
            #   readiness:
            #     enabled: true
            #     custom: true
            #     spec:
            #       httpGet:
            #         path: /metrics
            #         port: 9001
            #       initialDelaySeconds: 5
            #       periodSeconds: 10
            #       timeoutSeconds: 5
            #       failureThreshold: 3

    service:
      appservice:
        controller: hookshot
        ports:
          http:
            port: 80
            targetPort: 9993
      webhooks:
        controller: hookshot
        ports:
          http:
            port: 80
            targetPort: 9000
      metrics:
        controller: hookshot
        ports:
          http:
            port: 80
            targetPort: 9001

    route:
      webhooks:
        # Hookshot answers 404 at /; every listener serves /ready.
        annotations:
          gatus.home-operations.com/endpoint: |-
            path: /ready
        hostnames:
          - "hookshot.freckle.chat"
        parentRefs:
          - name: public
            namespace: gateway-system
        rules:
          - backendRefs:
              - name: hookshot-webhooks
                port: 80

    persistence:
      config:
        type: secret
        name: hookshot-config
        globalMounts:
          - path: /data/config.yml
            subPath: config.yml
          - path: /data/registration.yml
            subPath: registration.yml
          - path: /data/passkey.pem
            subPath: passkey.pem
