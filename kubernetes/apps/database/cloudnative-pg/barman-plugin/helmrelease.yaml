---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: plugin-barman-cloud
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  # v0.16.0 serves gRPC on every replica after cache sync; only the ObjectStore
  # controller needs the leader lease. TLS Secrets are read-only and each pod
  # listens on its own TCP socket, so updates can safely overlap.
  # Chart 0.9.0 hardcodes Recreate and probes the manager port instead of gRPC.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: plugin-barman-cloud
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: plugin-barman-cloud
              spec:
                minReadySeconds: 10
                strategy:
                  type: RollingUpdate
                  rollingUpdate:
                    maxUnavailable: 0
                    maxSurge: 1
                template:
                  spec:
                    containers:
                      - name: barman-cloud
                        readinessProbe:
                          tcpSocket:
                            port: 9090
  values:
    # The plugin must run in the CNPG operator's namespace (the operator
    # discovers plugins by Service in its own namespace). atlantis runs the
    # operator in cnpg-system, fairy in db — the cluster pointer substitutes.
    namespaceOverride: ${CNPG_OPERATOR_NAMESPACE:=cnpg-system}
    image:
      registry: ghcr.io
      repository: cloudnative-pg/plugin-barman-cloud
      tag: v0.16.0@sha256:6404a416718bd7aad943c67a25a7bb20d0558b43edfeab0bf167f013ca435882
    sidecarImage:
      registry: ghcr.io
      repository: cloudnative-pg/plugin-barman-cloud-sidecar
      tag: v0.16.0@sha256:c669259e20ed1e11fad821f735c396c19d929985aa05b9544b13ecc8b5a386d0
