---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kagent.dev/modelconfig_v1alpha2.json
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: probe-gateway-model
spec:
  provider: OpenAI
  model: nvidia/Qwen3.8-Flash-Next-NVFP4
  # The SDK requires a key; the loopback adapter replaces this placeholder.
  apiKeySecret: kagent-openai
  apiKeySecretKey: OPENAI_API_KEY
  openAI:
    apiFormat: chatCompletions
    baseUrl: http://127.0.0.1:8081/v1
    reasoningEffort: none
    temperature: "0.7"
    topP: "0.8"
    presencePenalty: "0"
    maxTokens: 4096
