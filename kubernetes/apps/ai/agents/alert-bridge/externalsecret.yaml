---
# Retain the retired bridge credential until its separate retirement is approved.
# Keep ESO ownership so pruning the alert route cannot delete the stored Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windmill-alert-triage-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: windmill-alert-triage-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: url
      remoteRef:
        key: ${CLUSTER_NAME}-observability-windmill-alert-triage-webhook
