---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/cilium.io/ciliumnetworkpolicy_v2.json
# App OIDC is user-specific; the gateway also protects startup recovery pages.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: floppy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: floppy
      io.cilium.k8s.policy.serviceaccount: floppy
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: gateway-system
            gateway.envoyproxy.io/owning-gateway-name: tailnet
        - matchLabels:
            io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: jellyfin
        - matchLabels:
            io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: silo-api
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: db
            cnpg.io/cluster: pg-18a
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: jellyfin
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    - toFQDNs:
        - matchName: freckle.id
        - matchName: api.trakt.tv
        - matchName: api.themoviedb.org
        - matchName: image.tmdb.org
        - matchName: api4.thetvdb.com
        - matchName: artworks.thetvdb.com
        - matchName: api.myanimelist.net
        - matchName: itunes.apple.com
        - matchName: openlibrary.org
        - matchName: comicvine.gamespot.com
        - matchName: boardgamegeek.com
        - matchName: raw.githubusercontent.com
        - matchName: github.com
        - matchName: release-assets.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
