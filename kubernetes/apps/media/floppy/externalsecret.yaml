---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: floppy-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: floppy-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET: "{{ .secret }}"
        DB_USER: "{{ .db_username }}"
        DB_PASSWORD: "{{ .db_password }}"
        FLOPPY_USERS: '{{ .users }}'
        SOCIALACCOUNT_PROVIDERS: >-
          {"openid_connect":{"OAUTH_PKCE_ENABLED":true,"SCOPE":["openid","profile","email"],"APPS":[{"provider_id":"freckleid","name":"Freckle ID","client_id":{{ index . "client-id" | toJson }},"secret":{{ index . "client-secret" | toJson }},"settings":{"server_url":"https://freckle.id/.well-known/openid-configuration"}}]}}
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-media-floppy-app
    - extract:
        key: ${CLUSTER_NAME}-media-floppy-oidc
