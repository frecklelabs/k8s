---
# yaml-language-server: $schema=https://www.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: recyclarr-configmap
    files:
      - recyclarr.yml=./config/recyclarr.yml
  - name: recyclarr-settings
    files:
      - settings.yml=./config/settings.yml
  - name: recyclarr-custom-formats
    files:
      - ./config/custom-formats/anime-bluray-encode.json
      - ./config/custom-formats/anime-non-english-dub.json
      - ./config/custom-formats/anime-web-2160p.json
  - name: recyclarr-custom-formats-radarr
    files:
      - ./config/custom-formats-radarr/remux.json
generatorOptions:
  disableNameSuffixHash: true
