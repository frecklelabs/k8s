---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/refs/tags/v8.0.0/schemas/settings-schema.json
# Shared by both clusters (atlantis replaces only recyclarr.yml).
resource_providers:
  # Our own Sonarr custom formats, next to the guide's (the anime profiles
  # use them). Mounted from the recyclarr-custom-formats ConfigMap.
  - name: frecklelabs-sonarr
    type: custom-formats
    path: /config/custom-formats
    service: sonarr
