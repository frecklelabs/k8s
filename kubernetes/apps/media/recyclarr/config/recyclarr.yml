---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/refs/tags/v8.0.0/schemas/config-schema.json
sonarr:
  sonarr:
    base_url: http://sonarr
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      series: jellyfin-tvdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    # Sonarr v5 keeps quality sizes per profile; this applies to the TV profile.
    # The anime profiles set their own below.
    quality_definition:
      type: series

    quality_profiles:
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
        reset_unmatched_scores:
          enabled: true
      # Two anime profiles from the same guide profile (a Recyclarr "profile
      # variant"; each needs an explicit name). [Anime] Remux-1080p keeps its
      # name so the existing Sonarr profile, and the series, Seerr and import
      # lists on it, are adopted in place rather than duplicated (Recyclarr
      # keeps no state here and matches profiles by name). [Anime] English is
      # for dub-native and kids' shows: it also takes English-only releases.
      # Both share qualities, sizes and the scoring layers below.
      #
      # Sonarr ranks quality before custom-format score, so Blu-ray, 4K WEB
      # and 1080p WEB share one allowed group ("Anime 1080p+", also the
      # cutoff) and custom formats decide between them. Otherwise a Blu-ray
      # (or 4K) release without an English dub beats a dual-audio WEB pack.
      # 720p is merged the same way. Remuxes and UHD Blu-ray stay disabled
      # (a remux season runs to 100+ GB) but are listed on top, so remux
      # files we already have are past the cutoff and never "upgraded". HDTV
      # stays a tier below, so an HDTV grab keeps upgrading.
      # The guide's 100 minimum only passes groups on its anime tier lists,
      # which rejects most releases of older shows on our trackers. 0 still
      # blocks everything scored -10000 (LQ groups, raws, AV1, VOSTFR, non-
      # English dubs).
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
        name: "[Anime] Remux-1080p"
        reset_unmatched_scores:
          enabled: true
        # Good anime encodes are small; TRaSH's anime sizes lower the minimums
        # (and allow 2160p sizes).
        quality_definition:
          type: anime
        min_format_score: 0
        upgrade:
          allowed: true
          until_quality: Anime 1080p+
        qualities:
          - name: Bluray-2160p Remux
            enabled: false
          - name: Bluray-2160p
            enabled: false
          - name: Bluray-1080p Remux
            enabled: false
          - name: Anime 1080p+
            qualities: [Bluray-1080p, WEBRip-2160p, WEBDL-2160p, WEBRip-1080p, WEBDL-1080p]
          - name: HDTV-1080p
          - name: Anime 720p
            qualities: [Bluray-720p, WEBRip-720p, WEBDL-720p]
          - name: HDTV-720p
          - name: Bluray-480p
            enabled: false
          - name: WEB 480p
            qualities: [WEBRip-480p, WEBDL-480p]
          - name: DVD
          - name: SDTV
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
        name: "[Anime] English"
        reset_unmatched_scores:
          enabled: true
        quality_definition:
          type: anime
        min_format_score: 0
        upgrade:
          allowed: true
          until_quality: Anime 1080p+
        # Same list as [Anime] Remux-1080p; keep them in step.
        qualities:
          - name: Bluray-2160p Remux
            enabled: false
          - name: Bluray-2160p
            enabled: false
          - name: Bluray-1080p Remux
            enabled: false
          - name: Anime 1080p+
            qualities: [Bluray-1080p, WEBRip-2160p, WEBDL-2160p, WEBRip-1080p, WEBDL-1080p]
          - name: HDTV-1080p
          - name: Anime 720p
            qualities: [Bluray-720p, WEBRip-720p, WEBDL-720p]
          - name: HDTV-720p
          - name: Bluray-480p
            enabled: false
          - name: WEB 480p
            qualities: [WEBRip-480p, WEBDL-480p]
          - name: DVD
          - name: SDTV

    custom_formats:
      - # Prefer season packs: +10 makes a same-tier pack an upgrade over single
        # episodes, so seasons get replaced by packs we can seed. Sonarr's
        # season-pack upgrade threshold (80%) is set in Sonarr itself.
        trash_ids:
          - 3bc5f395426614e155e585a2f056cdf1  # Season Pack
        assign_scores_to:
          - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
            score: 10
          - name: "[Anime] Remux-1080p"
            score: 10
          - name: "[Anime] English"
            score: 10
      - # Unwanted
        trash_ids:
          - 32b367365729d530ca1c124a0b180c64  # Bad Dual Groups
          - 82d40da2bc6923f41e14394075dd4b03  # No-RlsGroup
          - e1a997ddb54e3ecbfe06341ad323c458  # Obfuscated
          - 06d66ab109d4d2eddb2794d21526d140  # Retags
        assign_scores_to:
          - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)

      - # Anime scoring, in layers. Each layer outweighs everything below it
        # combined, so at equal quality group the order is:
        #   1. English audio: dual audio 6000, then (on [Anime] English only)
        #      English-only 3000, then Japanese-only 0.
        #   2. WEB 2160p +2200 > Blu-ray encode +700 > 1080p WEB (0).
        #   3. The guide's group tiers (BD 700-1400, WEB 100-600), streaming
        #      service (0-6), v0-v4 (-51..4) and Season Pack (+10).
        # The guide part of a score runs from -51 to 1420, so: a Blu-ray file
        # (>= 649) is never replaced by 1080p WEB (<= 620) with the same audio;
        # 4K WEB (>= 2149) beats any Blu-ray (<= 2120); and no video or group
        # bonus (<= 2820) makes up for losing the English dub.
        trash_ids:
          - 418f50b10f1907201b6cfdf881f467b7  # Anime Dual Audio
        assign_scores_to:
          - name: "[Anime] Remux-1080p"
            score: 6000
          - name: "[Anime] English"
            score: 6000
      - # English-only releases. Blocked (TRaSH's -10000) on the default anime
        # profile: dub-only anime releases are often TV or edited cuts and
        # lose the original audio. Dub-native and kids' shows (Pokemon,
        # Beyblade) go on [Anime] English, where they are wanted.
        trash_ids:
          - 9c14d194486c4014d422adc64092d794  # Dubs Only
        assign_scores_to:
          - name: "[Anime] Remux-1080p"
            score: -10000
          - name: "[Anime] English"
            score: 3000
      - # Local custom formats (recyclarr-custom-formats ConfigMap, see
        # settings.yml).
        trash_ids:
          - fd27cd9649c8cd9bdcc3f714d3dc6b49  # Anime Non-English Dub
        assign_scores_to:
          - name: "[Anime] Remux-1080p"
            score: -10000
          - name: "[Anime] English"
            score: -10000
      - trash_ids:
          - edd7799af318480331c2ec1da6014d9d  # Anime WEB 2160p
        assign_scores_to:
          - name: "[Anime] Remux-1080p"
            score: 2200
          - name: "[Anime] English"
            score: 2200
      - trash_ids:
          - a05944f1aca8fbc3cf608466dc467200  # Anime Bluray Encode
        assign_scores_to:
          - name: "[Anime] Remux-1080p"
            score: 700
          - name: "[Anime] English"
            score: 700

radarr:
  radarr:
    base_url: http://radarr
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      folder: plex-tmdb
      movie:
        rename: true
        standard: plex-tmdb

    quality_definition:
      type: sqp-uhd

    quality_profiles:
      - trash_id: 5128baeb2b081b72126bc8482b2a86a0  # [SQP] SQP-1 (2160p)
        reset_unmatched_scores:
          enabled: true
        # Upgrades off while [Movies] Default is built (C-2911): this profile
        # scores lossless audio -10000 and keeps replacing lossless files.
        upgrade:
          allowed: false

    custom_formats:
      - # HDR10+ Boost — Samsung S95F supports HDR10+
        trash_ids:
          - caa37d0df9c348912df1fb1d88f9273a  # HDR10+ Boost
        assign_scores_to:
          - trash_id: 5128baeb2b081b72126bc8482b2a86a0  # [SQP] SQP-1 (2160p)

      - # SDR (no WEBDL) — block SDR Remux/Bluray, allow SDR WEB for older movies
        trash_ids:
          - 25c12f78430a3a23413652cbd1d48d77  # SDR (no WEBDL)
        assign_scores_to:
          - trash_id: 5128baeb2b081b72126bc8482b2a86a0  # [SQP] SQP-1 (2160p)

      - # Unwanted
        trash_ids:
          - b6832f586342ef70d9c128d40c07b872  # Bad Dual Groups
          - cc444569854e9de0b084ab2b8b1532b2  # Black and White Editions
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5  # No-RlsGroup
          - 7357cf5161efbf8c4d5d0c30b4815ee2  # Obfuscated
          - 5c44f52a8714fdd79bb4d98e2673be1f  # Retags
        assign_scores_to:
          - trash_id: 5128baeb2b081b72126bc8482b2a86a0  # [SQP] SQP-1 (2160p)
