---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/refs/tags/v8.0.0/schemas/config-schema.json
sonarr:
  sonarr:
    base_url: http://sonarr
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      series: jellyfin-tvdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    # Sonarr v5 keeps quality sizes per profile; this applies to the TV profile.
    # The anime profiles set their own below.
    quality_definition:
      type: series

    quality_profiles:
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
        reset_unmatched_scores:
          enabled: true
      # Two anime profiles from the same guide profile (a Recyclarr "profile
      # variant"; each needs an explicit name). [Anime] Default is the guide's
      # [Anime] Remux-1080p renamed, since remuxes are off and 4K WEB is
      # allowed. Recyclarr keeps no state here and matches profiles by name,
      # so a rename must happen in Sonarr first (same id; series, Seerr and
      # import lists follow the id), then here; changing only this name
      # creates a second, empty profile. [Anime] English is for dub-native
      # and kids' shows: it also takes English-only releases.
      # Both share qualities, sizes and the scoring layers below.
      #
      # Sonarr ranks quality before custom-format score, so Blu-ray, 4K WEB
      # and 1080p WEB share one allowed group ("Anime 1080p+", also the
      # cutoff) and custom formats decide between them. Otherwise a Blu-ray
      # (or 4K) release without an English dub beats a dual-audio WEB pack.
      # 720p is merged the same way. Remuxes and UHD Blu-ray stay disabled
      # (a remux season runs to 100+ GB) but are listed on top, so remux
      # files we already have are past the cutoff and never "upgraded". HDTV
      # stays a tier below, so an HDTV grab keeps upgrading.
      # The guide's 100 minimum only passes groups on its anime tier lists,
      # which rejects most releases of older shows on our trackers. 0 still
      # blocks everything scored -10000 (LQ groups, raws, AV1, VOSTFR, non-
      # English dubs).
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
        name: "[Anime] Default"
        reset_unmatched_scores:
          enabled: true
        # Good anime encodes are small; TRaSH's anime sizes lower the minimums
        # (and allow 2160p sizes).
        quality_definition:
          type: anime
        min_format_score: 0
        upgrade:
          allowed: true
          until_quality: Anime 1080p+
        qualities:
          - name: Bluray-2160p Remux
            enabled: false
          - name: Bluray-2160p
            enabled: false
          - name: Bluray-1080p Remux
            enabled: false
          - name: Anime 1080p+
            qualities: [Bluray-1080p, WEBRip-2160p, WEBDL-2160p, WEBRip-1080p, WEBDL-1080p]
          - name: HDTV-1080p
          - name: Anime 720p
            qualities: [Bluray-720p, WEBRip-720p, WEBDL-720p]
          - name: HDTV-720p
          - name: Bluray-480p
            enabled: false
          - name: WEB 480p
            qualities: [WEBRip-480p, WEBDL-480p]
          - name: DVD
          - name: SDTV
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
        name: "[Anime] English"
        reset_unmatched_scores:
          enabled: true
        quality_definition:
          type: anime
        min_format_score: 0
        upgrade:
          allowed: true
          until_quality: Anime 1080p+
        # Same list as [Anime] Default; keep them in step.
        qualities:
          - name: Bluray-2160p Remux
            enabled: false
          - name: Bluray-2160p
            enabled: false
          - name: Bluray-1080p Remux
            enabled: false
          - name: Anime 1080p+
            qualities: [Bluray-1080p, WEBRip-2160p, WEBDL-2160p, WEBRip-1080p, WEBDL-1080p]
          - name: HDTV-1080p
          - name: Anime 720p
            qualities: [Bluray-720p, WEBRip-720p, WEBDL-720p]
          - name: HDTV-720p
          - name: Bluray-480p
            enabled: false
          - name: WEB 480p
            qualities: [WEBRip-480p, WEBDL-480p]
          - name: DVD
          - name: SDTV

    custom_formats:
      - # Prefer season packs: +10 makes a same-tier pack an upgrade over single
        # episodes, so seasons get replaced by packs we can seed. Sonarr's
        # season-pack upgrade threshold (80%) is set in Sonarr itself.
        trash_ids:
          - 3bc5f395426614e155e585a2f056cdf1  # Season Pack
        assign_scores_to:
          - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
            score: 10
          - name: "[Anime] Default"
            score: 10
          - name: "[Anime] English"
            score: 10
      - # Unwanted
        trash_ids:
          - 32b367365729d530ca1c124a0b180c64  # Bad Dual Groups
          - 82d40da2bc6923f41e14394075dd4b03  # No-RlsGroup
          - e1a997ddb54e3ecbfe06341ad323c458  # Obfuscated
          - 06d66ab109d4d2eddb2794d21526d140  # Retags
        assign_scores_to:
          - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)

      - # Anime scoring, in layers. Each layer outweighs everything below it
        # combined, so at equal quality group the order is:
        #   1. English audio: dual audio 6000, then (on [Anime] English only)
        #      English-only 3000, then Japanese-only 0.
        #   2. WEB 2160p +2200 > Blu-ray encode +700 > 1080p WEB (0).
        #   3. The guide's group tiers (BD 700-1400, WEB 100-600), streaming
        #      service (0-6), v0-v4 (-51..4) and Season Pack (+10).
        # The guide part of a score runs from -51 to 1420, so: a Blu-ray file
        # (>= 649) is never replaced by 1080p WEB (<= 620) with the same audio;
        # 4K WEB (>= 2149) beats any Blu-ray (<= 2120); and no video or group
        # bonus (<= 2820) makes up for losing the English dub.
        trash_ids:
          - 418f50b10f1907201b6cfdf881f467b7  # Anime Dual Audio
        assign_scores_to:
          - name: "[Anime] Default"
            score: 6000
          - name: "[Anime] English"
            score: 6000
      - # English-only releases. Blocked (TRaSH's -10000) on the default anime
        # profile: dub-only anime releases are often TV or edited cuts and
        # lose the original audio. Dub-native and kids' shows (Pokemon,
        # Beyblade) go on [Anime] English, where they are wanted.
        trash_ids:
          - 9c14d194486c4014d422adc64092d794  # Dubs Only
        assign_scores_to:
          - name: "[Anime] Default"
            score: -10000
          - name: "[Anime] English"
            score: 3000
      - # Local custom formats (recyclarr-custom-formats ConfigMap, see
        # settings.yml).
        trash_ids:
          - fd27cd9649c8cd9bdcc3f714d3dc6b49  # Anime Non-English Dub
        assign_scores_to:
          - name: "[Anime] Default"
            score: -10000
          - name: "[Anime] English"
            score: -10000
      - trash_ids:
          - edd7799af318480331c2ec1da6014d9d  # Anime WEB 2160p
        assign_scores_to:
          - name: "[Anime] Default"
            score: 2200
          - name: "[Anime] English"
            score: 2200
      - trash_ids:
          - a05944f1aca8fbc3cf608466dc467200  # Anime Bluray Encode
        assign_scores_to:
          - name: "[Anime] Default"
            score: 700
          - name: "[Anime] English"
            score: 700

radarr:
  radarr:
    base_url: http://radarr
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true

    # Kept at "Do Not Prefer" for [Movies] Default (C-2911). Radarr's "Prefer
    # and Upgrade" does reject another group's repack of the exact quality we
    # have, but it ranks revision above custom-format score: in a grouped
    # quality (Bluray-2160p and WEBDL-2160p are one group below) any group's
    # Bluray REPACK would replace a WEBDL file on revision alone, and a
    # repack file would block later score upgrades ("better revision").
    # With "Do Not Prefer" a repack is an ordinary release, judged by score.
    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      folder: plex-tmdb
      movie:
        rename: true
        standard: plex-tmdb

    # TRaSH's standard movie sizes, not the SQP streaming-sized ones. Radarr
    # keeps one size table for every profile.
    quality_definition:
      type: movie

    quality_profiles:
      # [Movies] Default (C-2911): the profile every movie uses. A variant
      # of TRaSH's UHD Bluray + WEB profile, for its language setting
      # (Original); every custom format score is set below, none inherited.
      # Recyclarr here keeps no state, so it creates this profile on its first
      # sync and adopts it by name on every later one.
      #
      # Radarr ranks quality before custom-format score:
      # - Remux-2160p, Blu-ray, WEB-DL and WEBRip 2160p are one group (the
      #   target and the cutoff), so audio, HDR and the Remux bonus decide
      #   between them, not the source (C-3257). As a separate quality above
      #   the cutoff, a remux could never replace a 4K file, even a lossy
      #   one: Radarr rejects a higher quality once the quality cutoff is met,
      #   before it looks at scores.
      # - Remux-1080p ranks on top but is disabled: the few 1080p remuxes we
      #   have are past the cutoff and never replaced, and none are grabbed.
      # - 1080p is a fallback below it: a movie with no 4K release gets the
      #   best 1080p and moves to 2160p when one appears.
      # - 720p and lower stay off; Recyclarr adds unlisted qualities disabled.
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # guide: UHD Bluray + WEB
        name: "[Movies] Default"
        reset_unmatched_scores:
          enabled: true
        min_format_score: 0
        # Scores come in layers, each larger than everything below it combined
        # (the table is in the PR that added this, k8s C-2911):
        #   TrueHD Atmos 10500 > other lossless 6000 > DD+ Atmos 4500 > other
        #   lossy 0; video (HDR 500, HDR10+ 200, DV 100, tier <= 300) adds at
        #   most 1100.
        # An upgrade needs +3000: every audio step except lossless <-> DD+
        # Atmos (1500 apart, at most 2600 with video) clears it in every case,
        # and no video or tier difference alone does.
        # A remux adds 2400 (bounds table in the PR that added it, C-3257):
        # with HDR on both sides, no encode replaces a lossless or TrueHD
        # Atmos remux, and a remux replaces an encode only with better audio.
        # SDR-scored encodes can also take a same-audio HDR remux when the
        # video-score gain is at least 600 (2400 + 600 meets the +3000 step).
        min_upgrade_format_score: 3000
        upgrade:
          allowed: true
          until_quality: Movies 2160p
          # TrueHD Atmos + HDR + the lowest tier: reachable, and past it no
          # upgrade is possible anyway (the +3000 step above).
          until_score: 11100
        qualities:
          - name: Remux-1080p
            enabled: false
          - name: Movies 2160p
            qualities: [Remux-2160p, Bluray-2160p, WEBDL-2160p, WEBRip-2160p]
          - name: Movies 1080p
            qualities: [Bluray-1080p, WEBDL-1080p, WEBRip-1080p]

    custom_formats:
      # ---- [Movies] Default scores (C-2911). Every format the guide profile
      # or its default groups bring in is listed, so none keeps a guide score.
      - # Audio 1: TrueHD Atmos. The Silo app sends its height channels to the
        # soundbar (Dolby MAT), so it ranks above every other track.
        trash_ids:
          - 496f355514737f7d83bf7aa4d24f8169  # TrueHD ATMOS
        assign_scores_to:
          - name: "[Movies] Default"
            score: 10500
      - # Audio 2: the other lossless codecs, one score so they never churn.
        trash_ids:
          - 2f22d89048b01681dde8afe203bf2e95  # DTS X
          - 3cafb66171b47f226146a0770576870f  # TrueHD
          - dcf3ec6938fa32445f590a4da84256cd  # DTS-HD MA
          - a570d4a0e56a2874b64e5bfa55202a1b  # FLAC
          - e7c2fcae07cbada050a0af3357491d7b  # PCM
        assign_scores_to:
          - name: "[Movies] Default"
            score: 6000
      - # Audio 3: DD+ Atmos (heights on both players). "ATMOS (undefined)" is
        # an Atmos title with no codec, almost always DD+ on WEB releases.
        trash_ids:
          - 1af239278386be2919e1bcee0bde047e  # DD+ ATMOS
          - 417804f7f2c4308c1f4c5d380d4c4475  # ATMOS (undefined)
        assign_scores_to:
          - name: "[Movies] Default"
            score: 4500
      - # Audio 4: other lossy audio is allowed (WEB-only titles still
        # download) but earns nothing.
        trash_ids:
          - 185f1dd7264c4562b9022d963ac37424  # DD+
          - 8e109e50e0a0b83a5098b056e13bf6db  # DTS-HD HRA
          - f9f847ac70a0af62ea4a08280b859636  # DTS-ES
          - 1c1a4c5e823891c75bc50380a6866f73  # DTS
          - 240770601cc226190c367ef59aba7463  # AAC
          - c2998bd0d90ed5621d8df281e839436e  # DD
        assign_scores_to:
          - name: "[Movies] Default"
            score: 0
      - # Video: HDR is the baseline; HDR10+ ranks above Dolby Vision because
        # the Samsung S95F has HDR10+ and no Dolby Vision. The boosts stack on
        # a release with both.
        trash_ids:
          - 493b6d1dbec3c3364c59d7607f7e3405  # HDR
        assign_scores_to:
          - name: "[Movies] Default"
            score: 500
      - trash_ids:
          - caa37d0df9c348912df1fb1d88f9273a  # HDR10+ Boost
        assign_scores_to:
          - name: "[Movies] Default"
            score: 200
      - trash_ids:
          - b337d6812e06c200ec9a2d3cfa9d20a7  # DV Boost
        assign_scores_to:
          - name: "[Movies] Default"
            score: 100
      - # Remux (local, recyclarr-custom-formats-radarr): any remux, on top
        # of its audio and video scores.
        trash_ids:
          - 41075226e09569ef80d8687cc7039b57  # Remux
        assign_scores_to:
          - name: "[Movies] Default"
            score: 2400
      - # Release-group tiers: a tie-break between releases with the same
        # audio. Bluray tiers apply to Blu-ray encodes, WEB tiers to WEB.
        trash_ids:
          - 4d74ac4c4db0b64bff6ce0cffef99bf0  # UHD Bluray Tier 01
          - ed27ebfef2f323e964fb1f61391bcb35  # HD Bluray Tier 01
          - c20f169ef63c5f40c2def54abaf4438e  # WEB Tier 01
        assign_scores_to:
          - name: "[Movies] Default"
            score: 300
      - trash_ids:
          - a58f517a70193f8e578056642178419d  # UHD Bluray Tier 02
          - c20c8647f2746a1f4c4262b0fbbeeeae  # HD Bluray Tier 02
          - 403816d65392c79236dcb6dd591aeda4  # WEB Tier 02
        assign_scores_to:
          - name: "[Movies] Default"
            score: 200
      - trash_ids:
          - e71939fae578037e7aed3ee219bbe7c1  # UHD Bluray Tier 03
          - 5608c71bcebba0a5e666223bae8c9227  # HD Bluray Tier 03
          - af94e0fe497124d1f9ce732069ec8c3b  # WEB Tier 03
        assign_scores_to:
          - name: "[Movies] Default"
            score: 100
      - # Neutral on purpose. Repacks: with "Do Not Prefer" (above) a repack
        # wins only by score, so another group's repack can't replace a file.
        # Streaming services and x265 (no HDR/DV) come in through the guide's
        # default groups; x265 in HD is blocked below instead.
        trash_ids:
          - e7718d7a3ce595f289bfee26adc178f5  # Repack/Proper
          - ae43b294509409a6a13919dedd4764c4  # Repack2
          - 5caaaa1c08c1742aa4342d8c4cc463f2  # Repack3
          - 839bea857ed2c0a8e084f3cbdbd65ecb  # x265 (no HDR/DV)
          - b3b3a6ac74ecbd56bcdbefa4799fb9df  # AMZN
          - df13ed57843877b21ad969184ab6888f  # ATV
          - 40e9380490e748672c2522eaaeb692f7  # ATVP
          - cc5e51a9e85a6296ceefe097a77f12f4  # BCORE
          - 16622a6911d1ab5d5b8b713d5b0036d4  # CRiT
          - 84272245b2988854bfb76a16e60baea5  # DSNP
          - 509e5f41146e278f9eab1ddaceb34515  # HBO
          - 5763d1b0ce84aff3b21038eea8e9b8ad  # HMAX
          - 526d445d4c16214309f0fd2b3be18a89  # Hulu
          - 7737598007e71665c5edc7f1626bfbf1  # IMF
          - e0ec9672be6cac914ffad34a6b077209  # iT
          - 2a6039655313bf5dab1e43523b62c374  # MA
          - 6a061313d22e51e0f25b7cd4dc065233  # MAX
          - 170b1d363bd8516fbf3a3eb05d4faff6  # NF
          - c9fd353f8f5f1baf56dc601c4cb29920  # PCOK
          - e36a0ba1bc902b26ee40818a1d59b8bd  # PMTP
          - 350e9170619683a55cb9191d0b1ababa  # PLAY
          - 44c2b54d7c81c1a442a8b2cabeaef54f  # ROKU
          - c2863d2a50c9acad1fb50e53ece60817  # STAN
        assign_scores_to:
          - name: "[Movies] Default"
            score: 0
      - # Blocked. -100000, so no stack of bonuses (at most 14000) lifts a
        # blocked release above the minimum score of 0. hallowed and
        # BHDStudio made most of SQP-1's lossy replacements; the rest is
        # TRaSH's unwanted set.
        trash_ids:
          - 7a0d1ad358fee9f5b074af3ef3f9d9ef  # hallowed
          - 5153ec7413d9dae44e24275589b5e944  # BHDStudio
          - 923b6abef9b17f937fab56cfcf89e1f1  # DV (w/o HDR fallback)
          - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)
          - ed38b889b31be83fda192888e2286d83  # BR-DISK
          - 90a6f9a284dff5103f6346090e6280c8  # LQ
          - e204b80c87be9497a8a6eaff48f72905  # LQ (Release Title)
          - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
          - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled
          - 0a3f082873eb454bde444150b70253cc  # Extras
          - 712d74cd88bceb883ee32f773656b1f5  # Sing-Along Versions
          - cae4ca30163749b891686f95532519bd  # AV1
          - e6886871085226c3da1830830146846c  # Generated Dynamic HDR
          - b6832f586342ef70d9c128d40c07b872  # Bad Dual Groups
          - c465ccc73923871b3eb1802042331306  # Line/Mic Dubbed
          - cc444569854e9de0b084ab2b8b1532b2  # Black and White Editions
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5  # No-RlsGroup
          - 7357cf5161efbf8c4d5d0c30b4815ee2  # Obfuscated
          - 5c44f52a8714fdd79bb4d98e2673be1f  # Retags
        assign_scores_to:
          - name: "[Movies] Default"
            score: -100000
