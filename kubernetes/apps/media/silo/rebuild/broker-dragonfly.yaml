---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: silo-dragonfly
spec:
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.1.0@sha256:94891bb22ce2fb0f7a5a3ff1bb3b2fbbc5830e2523293e47723d87fa3e5b1184
  replicas: 3
  authentication:
    passwordFromSecret:
      name: silo-split-secrets
      key: BROKER_PASSWORD
  args:
    - --proactor_threads=1
    - --maxmemory=512mb
    - --version_check=false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  podMetadata:
    labels:
      silo.freckle.systems/role: broker
  serviceAccountName: silo-dragonfly
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  skipFSGroup: true
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              silo.freckle.systems/role: broker
          topologyKey: kubernetes.io/hostname
  enableReplicationReadinessGate: true
  pdb:
    minAvailable: 2
