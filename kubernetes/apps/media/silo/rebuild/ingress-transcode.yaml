---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.26.1-standalone-strict/networkpolicy-networking-v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: silo-split-transcode-ingress
spec:
  podSelector:
    matchLabels:
      silo.freckle.systems/role: transcode
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              silo.freckle.systems/role: api
      ports:
        - protocol: TCP
          port: 8082
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 8082
