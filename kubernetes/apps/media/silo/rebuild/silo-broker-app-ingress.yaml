---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.26.1-standalone-strict/networkpolicy-networking-v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: silo-broker-ingress
spec:
  podSelector:
    matchLabels:
      silo.freckle.systems/role: broker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: silo.freckle.systems/role
                operator: In
                values:
                  - api
                  - transcode
      ports:
        - protocol: TCP
          port: 6379
    - from:
        - podSelector:
            matchLabels:
              silo.freckle.systems/role: broker
      ports:
        - protocol: TCP
          port: 9999
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: db
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dragonfly-operator
      ports:
        - protocol: TCP
          port: 9999
