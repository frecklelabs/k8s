---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: silo
spec:
  hostnames:
    - silo.${CLUSTER_SUBDOMAIN}.freckle.media
  parentRefs:
    - name: tailnet
      namespace: gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: silo-api-app
          port: 8080
