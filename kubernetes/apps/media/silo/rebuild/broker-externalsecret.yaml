---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-split-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: silo-split-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY: '{{ .secret_key }}'
        DATABASE_URL: postgres://{{ .db_username | urlquery | replace "+" "%20" }}:{{ .db_password | urlquery | replace "+"
          "%20" }}@${SILO_DATABASE_HOST}:5432/silo?sslmode=require
        REDIS_URL: redis://:{{ .redis_password | urlquery | replace "+" "%20" }}@silo-dragonfly.media.svc.cluster.local:6379/0
        BROKER_PASSWORD: '{{ .redis_password }}'
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-media-silo
