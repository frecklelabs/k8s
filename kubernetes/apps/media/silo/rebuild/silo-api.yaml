---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silo-api
spec:
  suspend: false
  interval: 1h
  timeout: 130m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  values:
    global:
      nameOverride: silo-api
      fullnameOverride: silo-api
      createDefaultServiceAccount: false
    controllers:
      api:
        type: deployment
        replicas: 2
        strategy: RollingUpdate
        revisionHistoryLimit: 2
        containers:
          app:
            image:
              repository: ghcr.io/silo-server/silo-server
              tag: build-2213@sha256:2a242495855cf002fda78ddbd308d34013595b333a6469cf07ab971f3b8ae309
            command:
              - /usr/local/bin/silo
            env:
              POSTGRES_TUNE: 'off'
              SILO_SEARCH_PROVIDER: postgres
              SILO_PLUGIN_CACHE_DIR: /config/silo/plugins
              SILO_MIGRATE_TIMEOUT: 60m
              SILO_MIGRATION_WAIT: 60m
              SILO_NET_TCP_CONGESTION: 'off'
              SILO_NET_TCP_SEND_BUFFER: 'off'
              TMPDIR: /tmp
              HOME: /tmp
              TZ: America/Chicago
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: silo-split-secrets
                    key: DATABASE_URL
              REDIS_URL:
                valueFrom:
                  secretKeyRef:
                    name: silo-split-secrets
                    key: REDIS_URL
              SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: silo-split-secrets
                    key: SECRET_KEY
              MODE: api
              PORT: '8080'
              SILO_SHUTDOWN_DELAY: 10s
              SILO_METRICS_LISTEN: :9091
            ports:
              - name: http
                containerPort: 8080
              - name: metrics
                containerPort: 9091
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: '8'
                memory: 10Gi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: http
                  timeoutSeconds: 10
                  periodSeconds: 10
                  failureThreshold: 750
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/ready
                    port: http
                  timeoutSeconds: 10
                  periodSeconds: 10
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: http
                  timeoutSeconds: 10
                  periodSeconds: 10
                  failureThreshold: 12
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      labels:
        silo.freckle.systems/role: api
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 3000
        runAsGroup: 3000
        fsGroup: 3000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  silo.freckle.systems/role: api
              topologyKey: kubernetes.io/hostname
    persistence:
      state:
        existingClaim: silo-state
        globalMounts:
          - path: /config/silo
      downloads:
        existingClaim: silo-state
        globalMounts:
          - path: /tmp/silo-download-artifacts
            subPath: download-artifacts
      tmp:
        type: emptyDir
        sizeLimit: 40Gi
        globalMounts:
          - path: /tmp
      media:
        existingClaim: ${SILO_MEDIA_CLAIM}
        globalMounts:
          - path: ${SILO_MEDIA_MOUNT}
            readOnly: true
    service:
      app:
        controller: api
        ports:
          http:
            port: 8080
            targetPort: http
      metrics:
        controller: api
        ports:
          metrics:
            port: 9091
            targetPort: metrics
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: silo-api
            patch: |
              - op: add
                path: /spec/progressDeadlineSeconds
                value: 7800
