---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: silo-db-rehearse-export2
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: silo-db-rehearse-export2
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
# Explicit denies also block additive cluster-wide DNS allowances.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: silo-db-rehearse-export2
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: silo-db-rehearse-export2
  ingressDeny:
    - fromEntities: [all]
  egressDeny:
    - toEntities: [all]
---
# One-attempt restore of the verified export2 archive into a scratch
# PostgreSQL inside this pod. The scratch database lives until the pod is
# deleted; removing it is a separate reviewed change, never implied here.
apiVersion: batch/v1
kind: Job
metadata:
  name: silo-db-rehearse-export2
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silo-db-rehearse-export2
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      # Same identity the export2 verifier used to read this archive.
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rehearse
          image: ghcr.io/cloudnative-pg/postgresql:18.3-standard-trixie@sha256:9f9f53c9e07e5b2924945e6eaeb9168f7e856786d221839866ac85ccd703b3ba
          command: [/bin/sh, /scripts/rehearse.sh]
          env:
            # Measured by the export2 verifier (C-2030).
            - name: EXPECTED_ARCHIVE_SHA256
              value: 624b3e9f3780e7e163d97a276b1a477c0ca1e6d9bfa3bdd50622e797f3d13a69
            # Checked against the archive's recorded database metadata before restore.
            - name: EXPECTED_LOCALE
              value: C
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
          volumeMounts:
            - name: archive
              mountPath: /archive
              readOnly: true
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: scratch
              mountPath: /scratch
          terminationMessagePolicy: File
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: silo-db-backup-2
            readOnly: true
        - name: script
          configMap:
            name: silo-db-rehearse-export2-script
            defaultMode: 0444
        - name: scratch
          emptyDir:
            sizeLimit: 10Gi
