---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: silo-db-backup-1
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: truenas-nfs-backup
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: silo-db-backup-2
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: truenas-nfs-backup
  resources:
    requests:
      storage: 20Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: silo-db-export-2
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: silo-db-export-2
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: db
          podSelector:
            matchLabels:
              cnpg.io/cluster: ${SILO_DATABASE_CLUSTER}
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: silo-db-export-2
spec:
  suspend: false
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silo-db-export-2
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 26
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: export
          image: ghcr.io/cloudnative-pg/postgresql:18.3-standard-trixie@sha256:9f9f53c9e07e5b2924945e6eaeb9168f7e856786d221839866ac85ccd703b3ba
          command: [/bin/sh, /scripts/export.sh]
          env:
            - name: APPROVED_RECOVERY_POINT
              value: c1942-pre-cutover-2
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: silo-secrets
                  key: DATABASE_URL
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 1Gi
          volumeMounts:
            - name: scratch
              mountPath: /scratch
            - name: archive
              mountPath: /archive
            - name: script
              mountPath: /scripts
              readOnly: true
          terminationMessagePolicy: File
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
        - name: archive
          persistentVolumeClaim:
            claimName: silo-db-backup-2
        - name: script
          configMap:
            name: silo-db-export-script
            defaultMode: 0444
