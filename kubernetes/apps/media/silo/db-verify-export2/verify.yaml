---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: silo-db-verify-export2
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: silo-db-verify-export2
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
# Explicit denies also block additive cluster-wide DNS allowances.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: silo-db-verify-export2
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: silo-db-verify-export2
  ingressDeny:
    - fromEntities: [all]
  egressDeny:
    - toEntities: [all]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: silo-db-verify-export2
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silo-db-verify-export2
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify
          image: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:23719505c7cc417b043ffd9998b44ab8d57fec1d92f0bf11b231a1754a5962f2
          command: [/bin/sh, /scripts/verify.sh]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: archive
              mountPath: /archive
              readOnly: true
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: scratch
              mountPath: /scratch
          terminationMessagePolicy: File
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: silo-db-backup-2
            readOnly: true
        - name: script
          configMap:
            name: silo-db-verify-export2-script
            defaultMode: 0444
        - name: scratch
          emptyDir:
            sizeLimit: 256Mi
