---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: silo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: silo
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
    ports:
    - port: 9091
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: silo-valkey
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: silo-valkey
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: silo
    ports:
    - port: 6379
      protocol: TCP
