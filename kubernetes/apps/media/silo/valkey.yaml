---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silo-valkey
  labels: &id001
    app.kubernetes.io/name: silo-valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 3000
        runAsGroup: 3000
        fsGroup: 3000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: valkey
        image: docker.io/valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
        command:
        - /bin/sh
        - -ec
        - exec valkey-server --dir /data --appendonly yes --appendfsync everysec --maxmemory
          256mb --maxmemory-policy noeviction --requirepass "$VALKEY_PASSWORD"
        env:
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: silo-secrets
              key: VALKEY_PASSWORD
        ports:
        - name: redis
          containerPort: 6379
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        readinessProbe:
          exec: &id002
            command:
            - /bin/sh
            - -ec
            - VALKEYCLI_AUTH="$VALKEY_PASSWORD" valkey-cli ping | grep -qx PONG
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          exec: *id002
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 12
        startupProbe:
          exec: *id002
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: silo-valkey
      - name: tmp
        emptyDir: {}
