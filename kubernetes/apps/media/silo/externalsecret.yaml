---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: silo-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY: '{{ .secret_key }}'
        DATABASE_URL: postgres://{{ .db_username }}:{{ .db_password }}@pg-18a-rw.db.svc.cluster.local:5432/silo?sslmode=require
        REDIS_URL: redis://:{{ .redis_password }}@silo-valkey:6379/0
        VALKEY_PASSWORD: '{{ .redis_password }}'
  dataFrom:
  - extract:
      key: ${CLUSTER_NAME}-media-silo
