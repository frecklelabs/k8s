---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.26.1-standalone-strict/networkpolicy-networking-v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: silo-restore-drill-3
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: silo-restore-drill-3
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
# Explicit denies also block additive cluster-wide DNS allowances. Loopback
# inside the pod (scratch PostgreSQL and Dragonfly) is unaffected.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: silo-restore-drill-3
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: silo-restore-drill-3
  ingressDeny:
    - fromEntities: [all]
  egressDeny:
    - toEntities: [all]
---
# One-attempt isolated recovery drill of the c1942-cutover-3 pair: export 3
# restored into a scratch PostgreSQL, the state backup copied into scratch, and
# Silo started on them with the preserved SECRET_KEY. Nothing here writes to
# the archive, the state backup or any production database or broker.
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.26.1-standalone-strict/job-batch-v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: silo-restore-drill-3
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silo-restore-drill-3
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # The state backup is a ReadWriteOnce claim already mounted by its
      # VolSync listener; share that node rather than attach it elsewhere.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: dst-silo-state
                  app.kubernetes.io/created-by: volsync
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: restore-db
          image: ghcr.io/cloudnative-pg/postgresql:18.3-standard-trixie@sha256:9f9f53c9e07e5b2924945e6eaeb9168f7e856786d221839866ac85ccd703b3ba
          command: [/bin/sh, /scripts/restore-db.sh]
          env:
            # Recorded by export 3 and re-verified by its Job (msg 78944).
            - name: EXPECTED_ARCHIVE_SHA256
              value: 71086934e5de09f0700ceefece6cd3fdc3eab77a0d047fe46ef981c03b16d9ae
            - name: EXPECTED_LOCALE
              value: C
          securityContext:
            runAsUser: 26
            runAsGroup: 26
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
          volumeMounts:
            - name: archive
              mountPath: /archive
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: db
              mountPath: /db
        - name: copy-state
          image: ghcr.io/silo-server/silo-server:build-2213@sha256:2a242495855cf002fda78ddbd308d34013595b333a6469cf07ab971f3b8ae309
          command: [/bin/sh, /scripts/copy-state.sh]
          securityContext:
            runAsUser: 3000
            runAsGroup: 3000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: state-backup
              mountPath: /state-backup
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: state
              mountPath: /state
        # Sidecars: loopback-only scratch database and broker for the drill.
        - name: postgres
          image: ghcr.io/cloudnative-pg/postgresql:18.3-standard-trixie@sha256:9f9f53c9e07e5b2924945e6eaeb9168f7e856786d221839866ac85ccd703b3ba
          restartPolicy: Always
          command:
            - postgres
            - -D
            - /db/pgdata
            - -c
            - listen_addresses=127.0.0.1
            - -c
            - unix_socket_directories=/db/private/socket
            - -c
            - unix_socket_permissions=0700
            - -c
            - max_connections=100
            - -c
            - dynamic_shared_memory_type=mmap
          securityContext:
            runAsUser: 26
            runAsGroup: 26
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          volumeMounts:
            - name: db
              mountPath: /db
        - name: dragonfly
          image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2@sha256:061f00b201b58e12f974e4e96c761a881ee1c05e9d8ee967466a604b7299753b
          restartPolicy: Always
          args:
            - --bind=127.0.0.1
            - --port=6379
            - --proactor_threads=1
            - --maxmemory=256mb
            - --version_check=false
            - --dir=/data
            - --dbfilename=
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: broker
              mountPath: /data
      containers:
        - name: drill
          image: ghcr.io/silo-server/silo-server:build-2213@sha256:2a242495855cf002fda78ddbd308d34013595b333a6469cf07ab971f3b8ae309
          command: [/bin/bash, /scripts/drill.sh]
          env:
            # Only the scratch database and broker inside this pod.
            - name: DATABASE_URL
              value: postgres://silo_drill@127.0.0.1:5432/silo_restore_drill?sslmode=disable
            - name: REDIS_URL
              value: redis://127.0.0.1:6379/0
            # The one production value: the preserved key, by single-key reference.
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: silo-split-secrets
                  key: SECRET_KEY
            - name: POSTGRES_TUNE
              value: 'off'
            - name: SILO_SEARCH_PROVIDER
              value: postgres
            - name: SILO_PLUGIN_CACHE_DIR
              value: /config/silo/plugins
            - name: SILO_MIGRATE_TIMEOUT
              value: 20m
            - name: SILO_SHUTDOWN_DELAY
              value: 0s
            - name: SILO_NET_TCP_CONGESTION
              value: 'off'
            - name: SILO_NET_TCP_SEND_BUFFER
              value: 'off'
            - name: PORT
              value: '8080'
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
            - name: TZ
              value: America/Chicago
          securityContext:
            runAsUser: 3000
            runAsGroup: 3000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '4'
              memory: 4Gi
          volumeMounts:
            - name: state
              mountPath: /config
            - name: tmp
              mountPath: /tmp
            - name: scripts
              mountPath: /scripts
              readOnly: true
          terminationMessagePolicy: File
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: silo-db-backup-3
            readOnly: true
        - name: state-backup
          persistentVolumeClaim:
            claimName: silo-state-backup
            readOnly: true
        - name: scripts
          configMap:
            name: silo-restore-drill-3-scripts
            defaultMode: 0444
        - name: db
          emptyDir:
            sizeLimit: 10Gi
        - name: state
          emptyDir:
            sizeLimit: 30Gi
        - name: tmp
          emptyDir:
            sizeLimit: 10Gi
        - name: broker
          emptyDir:
            sizeLimit: 1Gi
