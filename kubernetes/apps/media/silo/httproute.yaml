---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: silo
spec:
  hostnames:
    - silo.${CLUSTER_SUBDOMAIN}.freckle.media
  parentRefs:
    - name: tailnet
      namespace: gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: silo
          port: 8080
