---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: silo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: silo
  namespaceSelector:
    matchNames:
    - media
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
