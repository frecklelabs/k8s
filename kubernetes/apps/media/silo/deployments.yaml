# Overlap is allowed within a slot; other slots must use a different node.
# Bypass root s6 setup and keep each process transcode output in its own emptyDir.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silo-a
  labels: &id001
    app.kubernetes.io/name: silo
    silo.freckle.systems/slot: a
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 7800
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 3000
        runAsGroup: 3000
        fsGroup: 3000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups:
        - 44
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: silo
              matchExpressions:
              - key: silo.freckle.systems/slot
                operator: NotIn
                values:
                - a
            topologyKey: kubernetes.io/hostname
      resourceClaims:
      - name: gpu
        resourceClaimName: silo-a
      initContainers:
      - name: state-directories
        image: ghcr.io/silo-server/silo-server:build-2213@sha256:2a242495855cf002fda78ddbd308d34013595b333a6469cf07ab971f3b8ae309
        command:
        - /bin/sh
        - -ec
        - mkdir -p /config/silo/plugins /config/silo/download-artifacts; chmod 0700
          /config/silo/plugins
        securityContext: &id002
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - &id003
          name: state
          mountPath: /config/silo
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      containers:
      - name: silo
        image: ghcr.io/silo-server/silo-server:build-2213@sha256:2a242495855cf002fda78ddbd308d34013595b333a6469cf07ab971f3b8ae309
        command:
        - /bin/sh
        - -ec
        - |
          # Device permissions must be checked before migrations or listeners.
          id
          found=0
          for device in /dev/dri/renderD*; do
            [ -c "$device" ] || continue
            found=1
            stat -c 'render-device=%n uid=%u gid=%g mode=%a' "$device"
            [ -r "$device" ] && [ -w "$device" ] || exit 1
            ( : <> "$device" ) || exit 1
          done
          [ "$found" -eq 1 ] || exit 1
          exec /usr/local/bin/silo
        env:
        - name: MODE
          value: integrated
        - name: PORT
          value: '8080'
        - name: POSTGRES_TUNE
          value: 'off'
        - name: SILO_SEARCH_PROVIDER
          value: postgres
        - name: SILO_PLUGIN_CACHE_DIR
          value: /config/silo/plugins
        - name: SILO_SHUTDOWN_DELAY
          value: 10s
        - name: SILO_MIGRATE_TIMEOUT
          value: 60m
        - name: SILO_MIGRATION_WAIT
          value: 60m
        - name: SILO_METRICS_LISTEN
          value: :9091
        - name: SILO_NET_TCP_CONGESTION
          value: 'off'
        - name: SILO_NET_TCP_SEND_BUFFER
          value: 'off'
        - name: TMPDIR
          value: /tmp
        - name: HOME
          value: /tmp
        - name: TZ
          value: America/Chicago
        envFrom:
        - secretRef:
            name: silo-secrets
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9091
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: http
          timeoutSeconds: 10
          periodSeconds: 10
          failureThreshold: 750
        readinessProbe:
          httpGet:
            path: /api/v1/ready
            port: http
          timeoutSeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          timeoutSeconds: 10
          periodSeconds: 10
          failureThreshold: 12
        securityContext: *id002
        resources:
          claims:
          - name: gpu
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '8'
            memory: 10Gi
        volumeMounts:
        - *id003
        - name: tmp
          mountPath: /tmp
        - name: downloads
          mountPath: /tmp/silo-download-artifacts
          subPath: download-artifacts
        - name: media
          mountPath: ${SILO_MEDIA_MOUNT}
          readOnly: true
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: silo-state
      - name: tmp
        emptyDir:
          sizeLimit: 40Gi
      - name: downloads
        persistentVolumeClaim:
          claimName: silo-state
      - name: media
        persistentVolumeClaim:
          claimName: ${SILO_MEDIA_CLAIM}
          readOnly: true
