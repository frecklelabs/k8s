---
apiVersion: v1
kind: Service
metadata:
  name: silo
  labels: &id001
    app.kubernetes.io/name: silo
spec:
  selector: *id001
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: silo-metrics
  labels: &id001
    app.kubernetes.io/name: silo
spec:
  selector: *id001
  ports:
  - name: metrics
    port: 9091
    targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: silo-valkey
  labels: &id001
    app.kubernetes.io/name: silo-valkey
spec:
  selector: *id001
  ports:
  - name: redis
    port: 6379
    targetPort: redis
