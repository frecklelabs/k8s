---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.35.0-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floppy-flow-logger
spec:
  replicas: 1
  # Avoid duplicate capture streams during updates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: floppy-flow-logger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: floppy-flow-logger
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observe
          # The upstream Cilium image includes the Hubble CLI; no agent runs here.
          image: quay.io/cilium/cilium:v1.20.5@sha256:aa72499f075ad729947ea91b026218aceba24f1a8e4534bf36b8368c7c561526
          command: [/usr/bin/hubble]
          args:
            - observe
            - --server=hubble-relay.kube-system.svc.cluster.local:80
            - --follow
            - --since=1m
            - --pod=media/floppy
            # Pod filters match prefixes, which would otherwise include this logger.
            - --not
            - --pod=media/floppy-flow-logger
            - --output=json
            # Keep policy evidence, without HTTP URLs, headers or payloads.
            - --field-mask=time,uuid,node_name,verdict,drop_reason_desc,IP,l4,source,destination,source_service,destination_service,source_names,destination_names,l7.dns,traffic_direction,is_reply,event_type
          readinessProbe:
            exec:
              command:
                - /usr/bin/hubble
                - status
                - --server=hubble-relay.kube-system.svc.cluster.local:80
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
