---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: windmill
spec:
  interval: 1h
  chart:
    spec:
      chart: windmill
      version: 4.0.335
      sourceRef:
        kind: HelmRepository
        name: windmill
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    postgresql:
      enabled: false

    windmill:
      appReplicas: 1
      databaseUrlSecretName: windmill
      baseDomain: windmill.fairy.freckle.tools
      baseProtocol: https

      workerGroups:
        - name: default
          replicas: 1
          privileged: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

    ingress:
      enabled: false
