---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windmill
spec:
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-windmill-app
        version: "1"
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: windmill
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        url: "postgresql://{{ .username }}:{{ .password }}@pg-18a-rw.db.svc.cluster.local:5432/windmill?sslmode=disable"
