---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  data:
    # Pinned to the verified copy: a new GSM version must not rotate the
    # encryption key under existing data.
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: ${CLUSTER_NAME}-freckle-id-pocket-id
        property: encryption_key
        version: "1"
