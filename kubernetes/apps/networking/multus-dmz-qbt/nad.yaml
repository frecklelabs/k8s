---
# The torrent DMZ (VLAN 1100, IPv4 only): a second interface for qBittorrent
# pods, which send their torrent traffic out of it instead of the cluster's
# own egress. The routes cover every public IPv4 range and leave 10.0.0.0/8,
# so cluster traffic (the WebUI, DNS) stays on eth0.
#
# Each pod names its own address in its networks annotation. The MTU matches
# the tunnel the router sends this VLAN through, so nothing has to fragment.
# IPv6 is switched off on the interface: the VLAN carries none.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: multus-dmz-qbt
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "multus-dmz-qbt",
      "plugins": [
        {
          "type": "macvlan",
          "master": "bond0.1100",
          "mode": "bridge",
          "mtu": 1420,
          "capabilities": {
            "mac": true,
            "ips": true
          },
          "ipam": {
            "type": "static",
            "routes": [
              { "dst": "0.0.0.0/5", "gw": "10.255.110.1" },
              { "dst": "8.0.0.0/7", "gw": "10.255.110.1" },
              { "dst": "11.0.0.0/8", "gw": "10.255.110.1" },
              { "dst": "12.0.0.0/6", "gw": "10.255.110.1" },
              { "dst": "16.0.0.0/4", "gw": "10.255.110.1" },
              { "dst": "32.0.0.0/3", "gw": "10.255.110.1" },
              { "dst": "64.0.0.0/2", "gw": "10.255.110.1" },
              { "dst": "128.0.0.0/1", "gw": "10.255.110.1" }
            ]
          }
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv6.conf.IFNAME.disable_ipv6": "1"
          }
        }
      ]
    }
