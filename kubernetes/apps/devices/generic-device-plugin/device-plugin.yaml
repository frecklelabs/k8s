# generic-device-plugin.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: generic-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - operator: "Exists"
          effect: "NoExecute"
        - operator: "Exists"
          effect: "NoSchedule"
      containers:
        - image: squat/generic-device-plugin:latest@sha256:6fd8023741b24c0302a97153605ff77f4d55535a4b5a8b0c8502b208e8310525
          args:
            - --device
            - |
              name: tun
              groups:
                - count: 1000
                  paths:
                    - path: /dev/net/tun
            # Game streaming (Sunshine) creates virtual input devices through these.
            # The nodes only have them where the uinput/uhid Talos extensions are
            # installed; elsewhere the resource is advertised with zero capacity.
            - --device
            - |
              name: uinput
              groups:
                - count: 10
                  paths:
                    - path: /dev/uinput
            - --device
            - |
              name: uhid
              groups:
                - count: 10
                  paths:
                    - path: /dev/uhid
            # FUSE for unprivileged pods that mount AppImages and similar
            # (Steam Headless).
            - --device
            - |
              name: fuse
              groups:
                - count: 10
                  paths:
                    - path: /dev/fuse
            - --device
            - |
              name: dvb-t
              groups:
                - usb:
                    - vendor: 0bda
                      product: "2838"
            - --device
            - |
              name: zwave
              groups:
                - usb:
                    - vendor: 1a86
                      product: 55d4
            - --device
            - |
              name: zigbee
              groups:
                - usb:
                    - vendor: 10c4
                      product: ea60
          name: generic-device-plugin
          resources:
            requests:
              cpu: 50m
              memory: 20Mi
            limits:
              cpu: 100m
              memory: 50Mi
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
  updateStrategy:
    type: RollingUpdate
