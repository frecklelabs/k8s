---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: package-proxy
  namespace: dev-platform
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: package-proxy-site-isolation
      namespace: flux-system
    - name: package-proxy-secrets
      namespace: flux-system
    - name: cloudnative-pg-clusters
      namespace: db
  targetNamespace: dev-platform
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/dev-platform/package-proxy
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  postBuild:
    substitute:
      PACKAGE_PROXY_DB_CLUSTER: pg-17a
