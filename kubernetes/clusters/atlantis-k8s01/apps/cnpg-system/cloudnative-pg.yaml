---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cloudnative-pg
  namespace: &namespace cnpg-system
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: onepassword-stores
      namespace: external-secrets
  path: ./kubernetes/apps/database/cloudnative-pg/app
  targetNamespace: *namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  # C-72: atlantis reads the CNPG substitution values from GSM, like fairy's
  # db overlay. The shared ExternalSecret keeps its 1Password default.
  patches:
    - target:
        kind: ExternalSecret
        name: namespace-post-build-secrets
      patch: |-
        - op: replace
          path: /spec/secretStoreRef
          value:
            kind: SecretStore
            name: gcp-sm
        - op: replace
          path: /spec/dataFrom/0/extract
          value:
            key: ${CLUSTER_NAME}-cnpg-system-namespace-post-build-secrets
            version: "1"
