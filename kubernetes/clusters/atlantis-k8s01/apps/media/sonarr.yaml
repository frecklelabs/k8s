---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sonarr
  namespace: &namespace media
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
    - name: truenas-csi
      namespace: truenas-csi
  interval: 1h
  path: ./kubernetes/apps/media/sonarr
  # Mirror backups with rsync-tls after the Prowlarr restore check (C-38).
  components:
    - ../../../components/volsync-rsync-tls
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_UID: "943"
      VOLSYNC_CAPACITY: 30Gi
      VOLSYNC_SCHEDULE: "3 * * * *"
  patches:
    # Probe app health before changing the separate login-entry check.
    # Stop redirects so an auth-policy regression cannot create sign-in flows.
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: ${APP:=sonarr}
        spec:
          values:
            route:
              api:
                annotations:
                  gatus.home-operations.com/endpoint: |-
                    path: /ping
                    client:
                      ignore-redirect: true
                    conditions:
                      - "[STATUS] == 200"
    # The live PVC was created by the restic component, which restores from a
    # bootstrap ReplicationDestination via dataSourceRef. The rsync-tls PVC has
    # none, and PVC spec is immutable, so dropping it would fail the apply.
    # Keep it as it is on the bound PVC; it does nothing after binding.
    - patch: |-
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${APP}${VOLSYNC_PVC_SUFFIX:=}
        spec:
          dataSourceRef:
            apiGroup: volsync.backube
            kind: ReplicationDestination
            name: ${APP}${VOLSYNC_PVC_SUFFIX:=}-bootstrap
