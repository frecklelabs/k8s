---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vm-k8s-stack
  namespace: &namespace observability
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: prometheus-operator-crds
    - name: vm-operator-crds
    - name: grafana-operator
  targetNamespace: *namespace
  path: ./kubernetes/apps/observability/victoria-metrics/k8s-stack
  patches:
    - target:
        kind: HelmRelease
        name: vm-k8s-stack
      patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: vm-k8s-stack
        spec:
          values:
            vmsingle:
              spec:
                terminationGracePeriodSeconds: 90
                extraArgs:
                  http.maxGracefulShutdownDuration: 30s
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: k8s-cluster-info
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30s
  retryInterval: 1m
  timeout: 5m
