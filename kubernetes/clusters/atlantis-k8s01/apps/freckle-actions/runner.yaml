---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app freckle-actions-runner
  namespace: &namespace freckle-actions
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: actions-runner-controller
      namespace: actions-runner-system
    - name: freckle-actions-secrets
      namespace: flux-system
    - name: package-proxy
      namespace: dev-platform
  interval: 1h
  path: ./kubernetes/apps/actions-runner-controller/runners/freckle-actions
  patches:
    - target:
        group: helm.toolkit.fluxcd.io
        version: v2
        kind: HelmRelease
        name: freckle-actions-runner
      patch: |-
        # C-4600: runner work and image layers are emptyDir on the node's system
        # disk, which control-plane nodes share with etcd. Keep CI off those nodes.
        - op: add
          path: /spec/values/template/spec/affinity
          value:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
