---
# Under Wraps, the family wish-list app (C-1815). Its apps and Kustomization
# live in the private repo; the namespace is created here, like lore's,
# because the private root Kustomization targets flux-system and would rename
# a Namespace declared there. Pod Security "restricted" is enforced: Under
# Wraps is a distroless Go binary that runs non-root with every capability
# dropped; its SQLite database is the only thing it writes.
apiVersion: v1
kind: Namespace
metadata:
  name: underwraps
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    # Opt in to the cluster-wide GHCR pull secret, for the private underwraps
    # image. Only workloads that reference `ghcr-pull` use it.
    freckle.systems/ghcr-pull: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
