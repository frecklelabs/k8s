---
# Retiring: replay workloads are gone. Flux's garbage collection reads the
# prune annotation from the live object, so pruning is re-enabled here first;
# the follow-up change that removes this file then lets Flux delete the
# Namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-replay
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    freckle.systems/ghcr-pull: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/prune: enabled
