---
# Reserve the publisher namespace without importing shared credentials or DNS
# access. Workloads and their isolation proofs are delivered separately.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-reviewer-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    # The publisher runs the private cockpit image; this fans in only the
    # cluster's GHCR pull Secret, nothing else.
    freckle.systems/ghcr-pull: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# The shared DNS policy does not enable default-deny. Keep this baseline with
# the reserved namespace so future workloads need explicit traffic allowances.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: agent-reviewer-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# The reviewer publisher (C-1959, shadow mode only), its App key and database
# ExternalSecrets, its egress policy, and the boundary canaries. No RBAC.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app agent-reviewer-system-apps
  namespace: &namespace agent-reviewer-system
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/clusters/fairy-k8s01/apps/agent-reviewer-system
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
