---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app jina-reader
  namespace: &namespace janet-mcp
spec:
  targetNamespace: *namespace
  # C-781: park for the 72-hour consumer observation window; remove to roll back.
  patches:
    - target:
        group: apps
        kind: Deployment
      patch: |
        - op: replace
          path: /spec/replicas
          value: 0
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/inference/mcp/jina-reader
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
