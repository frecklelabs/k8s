---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gatus
  namespace: &namespace observability
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  targetNamespace: *namespace
  path: ./kubernetes/apps/observability/gatus
  # Listed here rather than through the flux-post-build-variables component:
  # TAILNET_DOMAIN lives in the private cluster-settings ConfigMap, which is
  # reflected only into the namespaces that use it. Not optional, so a missing
  # ConfigMap fails the reconcile instead of rendering an empty domain.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: k8s-cluster-info
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: namespace-post-build-secrets
        optional: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30s
  retryInterval: 1m
  timeout: 5m
