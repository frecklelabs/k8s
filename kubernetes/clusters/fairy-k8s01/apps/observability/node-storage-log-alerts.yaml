---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-storage-log-alerts
  namespace: observability
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  dependsOn:
    - name: victoria-logs
    - name: alertmanager-cockpit
  targetNamespace: observability
  path: ./kubernetes/apps/observability/node-storage-log-alerts
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30s
  retryInterval: 1m
  timeout: 5m
