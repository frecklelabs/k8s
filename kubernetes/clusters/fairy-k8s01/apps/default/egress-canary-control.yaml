---
# Positive control for agent-reviewer-system/egress-canary (C-1959): the same
# pod template in an ordinary namespace with no egress policy. It must print
# OPEN for dns, apiserver and external, so it exits 1 by design. Temporary:
# remove this file once the result is recorded on C-1959.
apiVersion: batch/v1
kind: Job
metadata:
  name: egress-canary-control
  annotations:
    # cluster-apps runs postBuild substitution, which would empty the
    # script's ${KUBERNETES_SERVICE_*} references and break the apiserver
    # probe; the canary's own Kustomization has no substitution.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: mirror.gcr.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          command: ["/bin/sh", "-c"]
          # DNS: any answer means open. curl exit 7 (refused) and 28
          # (timeout) mean blocked; anything else means a connection was made.
          args:
            - |
              open=0
              probe() {
                curl -sk -o /dev/null --connect-timeout 5 --max-time 10 "$2"
                rc=$?
                case "$rc" in
                  7|28) echo "BLOCKED $1 (curl $rc)" ;;
                  *) echo "OPEN $1 (curl $rc)"; open=1 ;;
                esac
              }
              for tool in nslookup timeout; do
                command -v "$tool" >/dev/null || { echo "MISSING $tool"; exit 2; }
              done
              if timeout 10 nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1; then
                echo "OPEN dns"; open=1
              else
                echo "BLOCKED dns"
              fi
              probe apiserver "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
              probe external https://1.1.1.1
              exit "$open"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
