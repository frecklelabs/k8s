---
# Second Flux source for fairy-k8s01: the PRIVATE frecklelabs/k8s-private repo.
# Mirrors the atlantis-k8s01 setup exactly — see that cluster's copy of this
# file. Private workloads and site-specific network-device scrape configs live
# there instead of in this public repo. See that repo's CLAUDE.md.
#
# Auth is the flux-system GitHub App (freckle-flux, Secret `github-app`, see
# kubernetes/apps/flux/instance/github-app-externalsecret.yaml), not an SSH
# deploy key. The App is installed only on frecklelabs/k8s and k8s-private,
# with contents write and no workflows permission, so GitHub refuses any push
# from it touching .github/workflows/ (a deploy key could push anything).
# Tokens are short-lived installation tokens, and image-automation-controller
# pushes flux/image-updates as a named App actor (C-1315).
#
# The deploy-key ExternalSecret stays for rollback until atlantis has switched
# too; then it and the keys are removed.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: infra-private
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/frecklelabs/k8s-private.git
  provider: github
  ref:
    branch: main
  secretRef:
    name: github-app
---
# Root Kustomization for the private source — the analogue of the FluxInstance's
# spec.sync for flux-system, but as a plain Kustomization since the operator
# manages only the primary source. Points at the private repo's fairy flux
# dir, which fans out to its own namespace + app Kustomizations (all of which
# must carry sourceRef: infra-private — CI in that repo enforces it).
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-private
  namespace: flux-system
spec:
  targetNamespace: flux-system
  sourceRef:
    kind: GitRepository
    name: infra-private
    namespace: flux-system
  path: ./kubernetes/clusters/fairy-k8s01/flux
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
