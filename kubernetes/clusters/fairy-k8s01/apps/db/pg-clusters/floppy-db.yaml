---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: floppy-db-role
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: floppy-db-role
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-db-floppy-role
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pg-18a-floppy
spec:
  name: floppy
  owner: floppy
  cluster:
    name: pg-18a
  ensure: present
