---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app autobrr
  namespace: &namespace media
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
    - name: truenas-csi
      namespace: truenas-csi
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/media/autobrr
  components:
    - ../../../components/volsync-rsync-tls
    - ../../../components/autobrr-announce-relay
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
  postBuild:
    substitute:
      APP: *app
      SEEDBANK_ANNOUNCE_RELAY_TAG: main-20261111T034304Z-a21f2ac@sha256:e274cedec18657e8518c1e653fbe7f779003360400c9f8d92991b4e040788d3b
      VOLSYNC_UID: "1000"
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_SCHEDULE: "28 * * * *"
