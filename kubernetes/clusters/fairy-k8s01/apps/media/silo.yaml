---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: silo
  namespace: media
spec:
  targetNamespace: media
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: cloudnative-pg-clusters
      namespace: db
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/media/silo
  interval: 2m
  retryInterval: 1m
  timeout: 130m
  prune: true
  deletionPolicy: Orphan
  wait: true
  postBuild:
    substitute:
      SILO_DATABASE_CLUSTER: pg-18a
      SILO_DATABASE_HOST: pg-18a-rw.db.svc.cluster.local
      SILO_MEDIA_CLAIM: store01-vault01-media
      SILO_MEDIA_MOUNT: /store01/vault01
    substituteFrom:
      - kind: ConfigMap
        name: k8s-cluster-info
  patches:
    - target:
        kind: Deployment
        name: silo-a
      patch: |-
        - op: replace
          path: /spec/replicas
          value: 1
    # Cutover window: hold the integrated writer stopped, then restart it automatically.
    # Recreate ends the old process before the hold starts; the split activation
    # removes this Deployment, so the hold only expires when the window overruns.
    - target:
        kind: Deployment
        name: silo-a
      patch: |-
        - op: replace
          path: /spec/strategy
          value:
            type: Recreate
        - op: add
          path: /spec/template/spec/initContainers/0
          value:
            name: cutover-hold
            image: ghcr.io/silo-server/silo-server:build-2213@sha256:2a242495855cf002fda78ddbd308d34013595b333a6469cf07ab971f3b8ae309
            command: [/bin/sh, -ec, 'echo cutover-hold: Silo stays stopped for 3600s; sleep 3600']
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 1m
                memory: 8Mi
              limits:
                memory: 32Mi
    # A single migration writer must pass acceptance before the second slot.
    - target:
        kind: Deployment
        name: silo-b
      patch: |-
        - op: replace
          path: /spec/replicas
          value: 0
