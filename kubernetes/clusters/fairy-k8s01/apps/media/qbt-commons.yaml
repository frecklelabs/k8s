---
# qBittorrent for public trackers. Unlike qbt-reel and qbt-ink, its torrent
# traffic never uses the cluster's egress: the pod has a second interface on
# the torrent DMZ and everything public is routed out of that.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qbt-commons
  namespace: &namespace media
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
    - name: truenas-csi
      namespace: truenas-csi
    - name: multus-dmz-qbt
      namespace: networking
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/media/qbittorrent
  components:
    - ../../../components/volsync-rsync-tls
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
  postBuild:
    substitute:
      APP: *app
      # Fresh PVC (bare name) owned by the share's uid.
      VOLSYNC_UID: "3000"
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_SCHEDULE: "11 * * * *"
      # Inside the NodePort range because the shared chart reuses it as a
      # nodePort. Peers reach this instance on the DMZ address, not a node.
      QBT_TRANSFER_PORT: "31577"
      MEDIA_PVC: store01-vault01-media
  patches:
    - target:
        kind: HelmRelease
      patch: |-
        # fairy's share root is /store01/vault01.
        - op: replace
          path: /spec/values/persistence/media/globalMounts
          value:
            - path: /store01/vault01/downloads/qbt-commons
              subPath: downloads/qbt-commons
        # The DMZ interface, with this instance's address on it.
        - op: add
          path: /spec/values/defaultPodOptions/annotations
          value:
            k8s.v1.cni.cncf.io/networks: |-
              [{"name": "multus-dmz-qbt", "namespace": "networking", "ips": ["10.255.110.3/28"]}]
        # Only the nodes with the DMZ VLAN can host it.
        - op: add
          path: /spec/values/defaultPodOptions/nodeSelector
          value:
            networks.freckle.systems/dmz-qbt: present
    # eth0 carries DNS and nothing else outward. The shared policy lets the
    # other instances reach the internet through the cluster; here that path
    # is closed, so a missing DMZ route or an IPv6 peer is dropped instead of
    # leaving from the cluster's own addresses.
    - target:
        kind: CiliumNetworkPolicy
        name: .*-egress
      patch: |-
        - op: replace
          path: /spec/egress
          value:
            - toEndpoints:
                - matchLabels:
                    k8s:io.kubernetes.pod.namespace: kube-system
                    k8s-app: kube-dns
              toPorts:
                - ports:
                    - port: "53"
                      protocol: UDP
                    - port: "53"
                      protocol: TCP
        - op: remove
          path: /spec/egressDeny
