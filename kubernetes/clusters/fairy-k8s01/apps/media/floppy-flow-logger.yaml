---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: floppy-flow-logger
  namespace: media
spec:
  # Temporary C-2876 capture; remove after restoring the evidence-based policy.
  targetNamespace: media
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/media/floppy-flow-logger
  interval: 2m
  retryInterval: 1m
  timeout: 2m
  prune: true
  wait: true
