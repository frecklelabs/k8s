---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mealie-file-check-c1931
  namespace: mealie
spec:
  targetNamespace: mealie
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/mealie-file-check
  dependsOn:
    - name: mealie
      namespace: mealie
  interval: 2m
  retryInterval: 1m
  timeout: 2m
  prune: false
  # A suspended Job cannot complete; verify application readiness separately.
  wait: false
