---
# Opt-in on the observation site only, after private runtime secret readiness.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - patch: |
      ---
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: ${APP:=autobrr}
      spec:
        values:
          controllers:
            autobrr:
              containers:
                announce-relay:
                  image:
                    repository: ghcr.io/frecklelabs/seedbank
                    tag: ${SEEDBANK_ANNOUNCE_RELAY_TAG}
                  args: [announce-relay]
                  env:
                    ANNOUNCE_RELAY_TOKEN_FILE: /announce-runtime/token
                    ANNOUNCE_RELAY_INDEXERS_FILE: /announce-runtime/indexers.json
                    ANNOUNCE_RELAY_DESTINATION:
                      valueFrom:
                        secretKeyRef:
                          name: autobrr-announce-runtime
                          key: destination
                  probes:
                    liveness: &relay-probe
                      enabled: true
                      custom: true
                      spec:
                        exec:
                          command: [/seedbank, announce-relay-health]
                        periodSeconds: 30
                        timeoutSeconds: 3
                        failureThreshold: 3
                    readiness: *relay-probe
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 65532
                    runAsGroup: 65532
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: [ALL]
                    seccompProfile:
                      type: RuntimeDefault
                  resources:
                    requests:
                      cpu: 5m
                      memory: 16Mi
                    limits:
                      memory: 64Mi
          persistence:
            # The relay must not inherit the application's credential-bearing config.
            config:
              globalMounts: []
              advancedMounts:
                autobrr:
                  app:
                    - path: /config
                      subPath: config
            tmp:
              globalMounts: []
              advancedMounts:
                autobrr:
                  app:
                    - path: /tmp
            announce-runtime:
              type: secret
              name: autobrr-announce-runtime
              defaultMode: 0444
              advancedMounts:
                autobrr:
                  announce-relay:
                    - path: /announce-runtime
                      readOnly: true
