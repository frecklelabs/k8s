# Live-only inputs of atlantis-k8s01's public Flux Kustomizations, for the
# offline render check (.github/workflows/render.yaml). Not applied to any
# cluster: scripts/prepare-render-root.py copies this into the CI checkout.
# Values only have to render.
#
# Add an entry when a Kustomization starts reading a ConfigMap/Secret or
# depending on a Kustomization that only the private repo creates; the check
# names it ("<ns>/<name> not found").
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: observability
data:
  TAILNET_DOMAIN: tailnet.render-placeholder.invalid
---
# Created by the private repo; read by homebox/homebox.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homebox-secret-source
  namespace: homebox
data:
  HOMEBOX_APP_SECRET_ID: render-placeholder
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: freckle-actions-secrets
  namespace: flux-system
spec:
  suspend: true
  interval: 1h
  path: ./render-placeholder
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: package-proxy-secrets
  namespace: flux-system
spec:
  suspend: true
  interval: 1h
  path: ./render-placeholder
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: package-proxy-site-isolation
  namespace: flux-system
spec:
  suspend: true
  interval: 1h
  path: ./render-placeholder
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
