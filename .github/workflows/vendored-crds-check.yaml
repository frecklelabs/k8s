---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Vendored CRDs Check

on:
  # render.yaml calls this on every merge_group so truncated file lists
  # cannot bypass the check. For pull_request it filters on vendoring inputs.
  workflow_call:

permissions:
  contents: read

jobs:
  gateway-api:
    name: gateway-api matches pinned tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify vendored CRDs match the pinned tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/vendor-gateway-api-crds.sh --check
